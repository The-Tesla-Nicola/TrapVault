services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-honeypot}
      POSTGRES_USER:     ${POSTGRES_USER:-honeypot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-honeypot}"]
      interval: 5s
      timeout:  5s
      retries:  10
    networks:
      - honeypot-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test:     ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}", "ping"]
      interval: 5s
      timeout:  5s
      retries:  10
    networks:
      - honeypot-net

  backend:
    build:
      context:    ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M
    command: >
      sh -c "python manage.py makemigrations core &&
             python manage.py migrate core &&
             python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput --clear &&
             gunicorn honeypot.wsgi:application --bind 0.0.0.0:8000 --worker-class gthread --workers 1 --threads 2 --timeout 30 --access-logfile - --error-logfile -"
    volumes:
      - static_files:/app/staticfiles
      - ./backend/geoip:/app/geoip:ro
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DEBUG:             ${DEBUG:-False}
      SECRET_KEY:        ${SECRET_KEY:-change-this-to-a-random-string-of-at-least-50-characters}
      JWT_SECRET_KEY:    ${JWT_SECRET_KEY:-change-this-to-a-random-string-of-at-least-50-characters}
      POSTGRES_HOST:     postgres
      POSTGRES_DB:       ${POSTGRES_DB:-honeypot}
      POSTGRES_USER:     ${POSTGRES_USER:-honeypot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-postgres-password-use-something-strong}
      REDIS_HOST:        redis
      REDIS_PASSWORD:    ${REDIS_PASSWORD:-change-this-redis-password}
      MONITOR_JWT_SECRET: ${MONITOR_JWT_SECRET:-change-this-to-a-random-string-of-at-least-50-characters}
      REAL_BANK_JWT_SECRET: ${REAL_BANK_JWT_SECRET:-change-this-real-bank-jwt-secret}
      ALLOWED_HOSTS:     ${ALLOWED_HOSTS:-*}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      GEOIP_PATH:        /app/geoip/GeoLite2-City.mmdb
      SIEM_DECEIVE_THRESHOLD: ${SIEM_DECEIVE_THRESHOLD:-45}
      SIEM_BLOCK_THRESHOLD:   ${SIEM_BLOCK_THRESHOLD:-120}
      SIEM_BURST_LIMIT:       ${SIEM_BURST_LIMIT:-20}
      SIEM_BRUTE_LIMIT:       ${SIEM_BRUTE_LIMIT:-8}
      SLACK_WEBHOOK_URL:  ${SLACK_WEBHOOK_URL:-}
      SMTP_HOST:          ${SMTP_HOST:-}
      SMTP_USER:          ${SMTP_USER:-}
      SMTP_PASSWORD:      ${SMTP_PASSWORD:-}
      ALERT_EMAIL_FROM:   ${ALERT_EMAIL_FROM:-siem@yourdomain.com}
      ALERT_EMAIL_TO:     ${ALERT_EMAIL_TO:-}
    networks:
      - honeypot-net

  celery-worker:
    build:
      context:    ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    command: ["celery", "-A", "honeypot", "worker", "-l", "info", "--concurrency=1"]
    volumes:
      - ./backend/geoip:/app/geoip:ro
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DEBUG:             ${DEBUG:-False}
      SECRET_KEY:        ${SECRET_KEY:-change-this-to-a-random-string-of-at-least-50-characters}
      POSTGRES_HOST:     postgres
      POSTGRES_DB:       ${POSTGRES_DB:-honeypot}
      POSTGRES_USER:     ${POSTGRES_USER:-honeypot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-postgres-password-use-something-strong}
      REDIS_HOST:        redis
      REDIS_PASSWORD:    ${REDIS_PASSWORD:-change-this-redis-password}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-change-this-redis-password}@redis:6379/0
      MONITOR_JWT_SECRET: ${MONITOR_JWT_SECRET:-change-this-monitor-jwt-secret}
      C_FORCE_ROOT:      "1"
      CELERY_WORKER_CONCURRENCY: "1"
    networks:
      - honeypot-net

  celery-beat:
    build:
      context:    ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
    command: ["celery", "-A", "honeypot", "beat", "-l", "info", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DEBUG:             ${DEBUG:-False}
      SECRET_KEY:        ${SECRET_KEY:-change-this-to-a-random-string-of-at-least-50-characters}
      POSTGRES_HOST:     postgres
      POSTGRES_DB:       ${POSTGRES_DB:-honeypot}
      POSTGRES_USER:     ${POSTGRES_USER:-honeypot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-postgres-password-use-something-strong}
      REDIS_HOST:        redis
      REDIS_PASSWORD:    ${REDIS_PASSWORD:-change-this-redis-password}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-change-this-redis-password}@redis:6379/0
      C_FORCE_ROOT:      "1"
    networks:
      - honeypot-net

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./real-site:/usr/share/nginx/real-site:ro
      - static_files:/app/staticfiles:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - honeypot-net


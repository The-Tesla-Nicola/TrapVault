# Rate limiting zones (http level)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/s;

upstream django_backend {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    include /etc/nginx/mime.types;

    proxy_buffer_size          128k;
    proxy_buffers              4 256k;
    proxy_busy_buffers_size    256k;

    # Security Headers
    add_header X-Frame-Options           "DENY"                            always;
    add_header X-Content-Type-Options    "nosniff"                         always;
    add_header X-XSS-Protection          "1; mode=block"                   always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; connect-src 'self' *; font-src 'self' https://fonts.gstatic.com" always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    server_tokens off;

    # Health check endpoint
    location /health/ {
        return 200 '{"status":"ok","timestamp":"$time_iso8601"}\n';
        add_header Content-Type application/json;
    }

    # Frontend static files
    location / {
        root       /usr/share/nginx/html;
        try_files  $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Real site
    location /L3JlYWwtc2l0ZS8= {
        root /usr/share/nginx/real-site;
        rewrite ^/L3JlYWwtc2l0ZS8=/(.*)$ /$1 break;
        rewrite ^/L3JlYWwtc2l0ZS8=$ /index.html break;
    }

    # Static files
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy to Django - Let Django handle ALL CORS headers
    location /monitor/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API with rate limiting
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://django_backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # Scanner trap
    location ~ ^/(\.git|\.env|\.htaccess|wp-admin|wp-login\.php|phpmyadmin|adminer|actuator) {
        proxy_pass http://django_backend/api$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml;
}